# Generated by `regent compile --dialect cel --full`
config:
  readinessAddr: 127.0.0.1:15021
  statsAddr: 127.0.0.1:15020
  adminAddr: 127.0.0.1:15000
  enableIpv6: false
binds:
- port: 3000
  listeners:
  - routes:
    - policies:
        mcpAuthorization:
          rules:
          - mcp.tool.target == "custodian" && mcp.tool.name == "place_trade"
          - mcp.tool.target == "custodian" && mcp.tool.name == "debit_fee"
          - mcp.tool.target == "custodian" && mcp.tool.name == "transfer_funds"
          - mcp.tool.target == "email" && mcp.tool.name == "send"
          - mcp.tool.target == "crm" && mcp.tool.name == "export"
          - mcp.tool.target == "esign" && mcp.tool.name == "send_envelope"
          - mcp.tool.target == "esign" && mcp.tool.name == "void_envelope"
        extAuthz:
          host: localhost:9000
          includeRequestBody:
            maxRequestBytes: 65536
          protocol:
            grpc:
              metadata:
                dev.agentgateway.jwt: '{"claims": jwt}'
        jwtAuth:
          issuer: regent-demo
          audiences:
          - ria-agents
          jwks:
            file: ./examples/agentgateway-ria-demo/out/jwks.json
      backends:
      - mcp:
          targets:
          - name: custodian
            stdio:
              cmd: python3
              args:
              - examples/agentgateway-ria-demo/demo_servers.py
              - custodian
          - name: crm
            stdio:
              cmd: python3
              args:
              - examples/agentgateway-ria-demo/demo_servers.py
              - crm
          - name: email
            stdio:
              cmd: python3
              args:
              - examples/agentgateway-ria-demo/demo_servers.py
              - email
          - name: esign
            stdio:
              cmd: python3
              args:
              - examples/agentgateway-ria-demo/demo_servers.py
              - esign

