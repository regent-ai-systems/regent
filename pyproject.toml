[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regent-compliance"
version = "0.1.0"
description = "Vertical compliance layer for AI agents: regulatory policy packs, compliance-grade approval workflows, auditor-ready evidence. Runs on agentgateway and the Microsoft Agent Governance Toolkit."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Regent AI Systems LLC" }]
keywords = ["mcp", "agentgateway", "compliance", "ext_authz", "finra", "sec", "hipaa", "pci", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6",
  "click>=8.1",
  "aiohttp>=3.9",
  "httpx>=0.27",
  "grpcio>=1.60",
  "xds-protos>=1.60",
  "protobuf>=4.25",
  "opentelemetry-proto>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
regent = "regent.cli.main:cli"

[tool.setuptools.packages.find]
include = ["regent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
