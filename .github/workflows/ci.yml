name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Fetch agentgateway (CEL compiled output is validated against the real binary)
        run: |
          curl -sSL -o /usr/local/bin/agentgateway https://github.com/agentgateway/agentgateway/releases/latest/download/agentgateway-linux-amd64
          chmod +x /usr/local/bin/agentgateway
          agentgateway -V
      - run: regent lint packs/ria --firm-overlay packs/ria/firm.example.yaml && regent lint packs/dev_default
      - run: AGENTGATEWAY=/usr/local/bin/agentgateway pytest -q
      - run: ruff check regent tests
      - name: End-to-end demo against the real gateway
        run: pip install pyjwt cryptography mcp && python examples/agentgateway-ria-demo/run_demo.py --agentgateway /usr/local/bin/agentgateway
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: DCO sign-off present on every commit
        run: |
          for c in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B $c | grep -q '^Signed-off-by:' || { echo "missing Signed-off-by on $c"; exit 1; }
          done
